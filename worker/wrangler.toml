name = "vibe-buddy-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# DEMO_MODE: "live" | "replay". Replay serves recorded fixtures (demo-safe,
# no key, no network). A request can override with the `x-demo-mode` header
# (that's how `DEMO_MODE=live bash scripts/smoke.sh` works against a running
# dev server). Live without a MISTRAL_API_KEY silently degrades to replay.
[vars]
MISTRAL_BASE_URL = "https://api.mistral.ai/v1"
# Verified against GET /v1/models 2026-07-18 (dated equivalent: mistral-medium-2604)
MISTRAL_CHAT_MODEL = "mistral-medium-3-5"
VOXTRAL_MODEL = "voxtral-mini-latest"
DEMO_MODE = "replay"

# Import *.sse fixture files as text modules.
[[rules]]
type = "Text"
globs = ["**/*.sse"]
fallthrough = true
